<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Spesimen TTE</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        /* Ketentuan Font: Arial, 8pt (Setara ~11px), Spasi 1 atau 1.5 */
        .spesimen-box {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11px; /* Ukuran setara 8pt */
            line-height: 1.4; 
            border: 1px solid #000000;
            border-radius: 12px; /* Lengkungan persis dokumen asli */
            padding: 16px 24px 16px 20px; /* Jarak dalam kotak */
            width: 420px; /* Diperlebar agar teks muat 1 baris */
            background-color: #ffffff;
            display: flex;
            align-items: center;
            box-sizing: border-box;
            color: #000000;
        }

        .logo-container {
            width: 75px; /* Logo diperbesar */
            height: 75px;
            margin-right: 20px; /* Jarak antara logo dan teks */
            position: relative;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Memastikan seluruh bagian logo masuk tanpa terpotong */
        }

        /* Trik khusus: Menutupi border hitam dari gambar asal menggunakan bingkai putih,
           sehingga logo tidak perlu di-crop/terpotong sama sekali. */
        .logo-container::after {
            content: "";
            position: absolute;
            top: -1px; left: -1px; right: -1px; bottom: -1px;
            border: 6px solid #ffffff;
            pointer-events: none;
        }

        .text-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: left;
            width: 100%;
        }

        .spacer {
            height: 32px; /* Ruang kosong untuk tanda tangan visual (proporsional) */
        }

        .uppercase-text {
            text-transform: uppercase;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-6 md:p-8 rounded-lg shadow-lg w-full max-w-4xl flex flex-col md:flex-row gap-8">
        
        <!-- Bagian Form Input -->
        <div class="w-full md:w-1/2">
            <h2 class="text-2xl font-bold mb-5 text-gray-800">Form Spesimen TTE</h2>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700">Jabatan</label>
                <input type="text" id="input-jabatan" class="mt-1 p-2 w-full border rounded outline-blue-500" oninput="updatePreview()" value="OPERATOR LAYANAN OPERASIONAL">
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700">Nama Lengkap</label>
                <input type="text" id="input-nama" class="mt-1 p-2 w-full border rounded outline-blue-500" oninput="updatePreview()" value="HANJAR CATUR SAKSONO">
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700">Pangkat (Hapus jika tidak perlu)</label>
                <!-- Kosong secara default agar tidak muncul tulisan "Pangkat" jika tidak diisi -->
                <input type="text" id="input-pangkat" class="mt-1 p-2 w-full border rounded outline-blue-500" oninput="updatePreview()" value="">
            </div>
        </div>

        <!-- Bagian Preview -->
        <div class="w-full md:w-1/2 flex flex-col items-center justify-center border-t-2 md:border-t-0 md:border-l-2 pt-6 md:pt-0 md:pl-8">
            <h2 class="text-xl font-bold mb-5 text-gray-800 text-center w-full">Preview Spesimen</h2>
            
            <!-- Area yang akan diunduh -->
            <div class="overflow-x-auto w-full flex justify-center pb-4">
                <div id="spesimen-preview" class="spesimen-box shadow-sm">
                    <div class="logo-container">
                        <img src="logo.png" alt="Logo BSrE">
                    </div>
                    <div class="text-container">
                        <span style="text-transform: none;">Ditandatangani secara elektronik oleh:</span>
                        <strong id="preview-jabatan" class="uppercase-text font-bold"></strong>
                        <div class="spacer"></div>
                        <span id="preview-nama" class="uppercase-text"></span>
                        <span id="preview-pangkat"></span>
                    </div>
                </div>
            </div>

            <button onclick="downloadImage()" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded w-full max-w-[420px] transition-colors">
                Unduh Spesimen (PNG)
            </button>
        </div>
    </div>

    <script>
        function updatePreview() {
            const valJabatan = document.getElementById('input-jabatan').value;
            const valNama = document.getElementById('input-nama').value;
            const valPangkat = document.getElementById('input-pangkat').value;

            // Jabatan dengan koma
            const jabatanEl = document.getElementById('preview-jabatan');
            jabatanEl.innerText = valJabatan.trim() === "" ? "" : valJabatan + ",";

            // Nama
            document.getElementById('preview-nama').innerText = valNama;
            
            // Pangkat (Sembunyikan baris jika kosong)
            const pangkatEl = document.getElementById('preview-pangkat');
            if (valPangkat.trim() === "") {
                pangkatEl.style.display = 'none';
                pangkatEl.innerText = "";
            } else {
                pangkatEl.style.display = 'block';
                pangkatEl.innerText = valPangkat;
            }
        }

        function downloadImage() {
            const element = document.getElementById('spesimen-preview');
            html2canvas(element, { 
                scale: 4, // 4x lipat resolusi agar tajam untuk dicetak
                backgroundColor: "#ffffff" // Background paksa putih
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'spesimen-tte.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        // Inisialisasi tampilan pertama kali
        updatePreview();
    </script>
</body>
</html>
