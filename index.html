<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Spesimen TTE</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        /* Ketentuan Font: Arial, Ukuran 8pt, Spasi 1 atau 1.5 */
        .spesimen-box {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 8pt; /* Ukuran sesuai ketentuan */
            line-height: 1.3; /* Spasi disesuaikan agar proporsional */
            border: 1px solid #000;
            border-radius: 8px; /* Ujung melengkung */
            padding: 12px 18px; /* Padding disesuaikan */
            display: flex;
            align-items: center;
            width: 380px; /* Lebar kotak diperbesar agar mirip dokumen asli */
            background-color: #ffffff;
            box-sizing: border-box;
            color: #000000;
        }

        .logo-container {
            width: 50px; /* Ukuran logo disesuaikan */
            height: 50px;
            margin-right: 18px;
            flex-shrink: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Crop logo otomatis */
        .logo-container img {
            width: 115%; 
            height: 115%;
            object-fit: cover;
            clip-path: inset(6% 6% 6% 6%); 
        }

        .text-container {
            display: flex;
            flex-direction: column;
            text-align: left;
            width: 100%;
        }

        .spacer {
            height: 25px; /* Jarak kosong yang cukup lebar untuk tempat tanda tangan visual */
        }

        .uppercase-text {
            text-transform: uppercase;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-5">

    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-4xl flex flex-col md:flex-row gap-8">
        
        <!-- Bagian Form Input -->
        <div class="w-full md:w-1/2">
            <h2 class="text-2xl font-bold mb-5 text-gray-800">Form Spesimen TTE</h2>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700">Jabatan</label>
                <input type="text" id="input-jabatan" class="mt-1 p-2 w-full border rounded" placeholder="Contoh: GUBERNUR JAWA BARAT" oninput="updatePreview()" value="OPERATOR LAYANAN OPERASIONAL">
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700">Nama & Gelar</label>
                <input type="text" id="input-nama" class="mt-1 p-2 w-full border rounded" placeholder="Contoh: DR. H. MOCHAMAD RIDWAN KAMIL" oninput="updatePreview()" value="HANJAR CATUR SAKSONO">
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700">Pangkat (Kosongkan jika tidak ada)</label>
                <!-- Input pangkat dikosongkan secara default -->
                <input type="text" id="input-pangkat" class="mt-1 p-2 w-full border rounded" placeholder="Contoh: Pembina Utama" oninput="updatePreview()" value="">
            </div>
        </div>

        <!-- Bagian Preview -->
        <div class="w-full md:w-1/2 flex flex-col items-center justify-center border-l-2 pl-8">
            <h2 class="text-xl font-bold mb-5 text-gray-800">Preview Spesimen</h2>
            
            <!-- Kotak Spesimen -->
            <div id="spesimen-preview" class="spesimen-box shadow-sm">
                <div class="logo-container">
                    <img src="logo.png" alt="Logo BSrE">
                </div>
                <div class="text-container">
                    <span style="text-transform: none;">Ditandatangani secara elektronik oleh:</span>
                    <strong id="preview-jabatan" class="uppercase-text font-bold"></strong>
                    <div class="spacer"></div>
                    <span id="preview-nama" class="uppercase-text"></span>
                    <span id="preview-pangkat"></span>
                </div>
            </div>

            <button onclick="downloadImage()" class="mt-8 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full">
                Unduh Spesimen (PNG)
            </button>
        </div>
    </div>

    <script>
        function updatePreview() {
            const valJabatan = document.getElementById('input-jabatan').value;
            const valNama = document.getElementById('input-nama').value;
            const valPangkat = document.getElementById('input-pangkat').value;

            // Update Jabatan (Tambah koma jika ada isinya)
            const jabatanEl = document.getElementById('preview-jabatan');
            if (valJabatan.trim() === "") {
                jabatanEl.innerText = "";
            } else {
                jabatanEl.innerText = valJabatan + ",";
            }

            // Update Nama
            document.getElementById('preview-nama').innerText = valNama;
            
            // Logika baru untuk Pangkat: Benar-benar dihilangkan dari tampilan jika input kosong
            const pangkatEl = document.getElementById('preview-pangkat');
            if (valPangkat.trim() === "") {
                pangkatEl.style.display = 'none';
                pangkatEl.innerText = "";
            } else {
                pangkatEl.style.display = 'block';
                pangkatEl.innerText = valPangkat;
            }
        }

        function downloadImage() {
            const element = document.getElementById('spesimen-preview');
            html2canvas(element, { 
                scale: 4, // Kualitas tinggi
                backgroundColor: "#ffffff" // Pastikan background dirender putih polos
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'spesimen-tte.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        // Jalankan sekali saat web dimuat
        updatePreview();
    </script>
</body>
</html>
