<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Spesimen TTE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        /* Ketentuan Font: Arial, Ukuran 8pt (sekitar 10.5px - 11px), Spasi 1 */
        .spesimen-box {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 8pt; 
            line-height: 1.25; 
            border: 1.5px solid #000000; /* Garis lebih jelas */
            border-radius: 10px; /* Lengkungan sudut disesuaikan */
            padding: 12px 16px; 
            display: flex;
            align-items: center;
            width: 330px; /* Lebar diperkecil agar tidak terlalu memanjang */
            background-color: #ffffff;
            box-sizing: border-box;
            color: #000000;
        }

        .logo-container {
            width: 65px; /* LOGO DIPERBESAR */
            height: 65px;
            margin-right: 16px;
            flex-shrink: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container img {
            width: 115%; 
            height: 115%;
            object-fit: cover;
            clip-path: inset(5% 5% 5% 5%); 
        }

        .text-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: left;
            width: 100%;
        }

        .spacer {
            height: 45px; /* JARAK NAMA DAN JABATAN DIPERLEBAR */
        }

        .uppercase-text {
            text-transform: uppercase;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-5">

    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-4xl flex flex-col md:flex-row gap-8">
        
        <!-- Bagian Form Input -->
        <div class="w-full md:w-1/2">
            <h2 class="text-2xl font-bold mb-5 text-gray-800">Form Spesimen TTE</h2>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700">Jabatan</label>
                <input type="text" id="input-jabatan" class="mt-1 p-2 w-full border rounded" oninput="updatePreview()" value="OPERATOR LAYANAN OPERASIONAL">
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700">Nama Lengkap</label>
                <input type="text" id="input-nama" class="mt-1 p-2 w-full border rounded" oninput="updatePreview()" value="HANJAR CATUR SAKSONO">
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700">Pangkat (Hapus isinya jika tidak ada)</label>
                <input type="text" id="input-pangkat" class="mt-1 p-2 w-full border rounded" oninput="updatePreview()" value="Pangkat">
            </div>
        </div>

        <!-- Bagian Preview -->
        <div class="w-full md:w-1/2 flex flex-col items-center justify-center border-l-2 md:pl-8">
            <h2 class="text-xl font-bold mb-5 text-gray-800">Preview Spesimen</h2>
            
            <!-- Kotak Spesimen -->
            <div id="spesimen-preview" class="spesimen-box shadow-sm">
                <div class="logo-container">
                    <img src="logo.png" alt="Logo BSrE">
                </div>
                <div class="text-container">
                    <span style="text-transform: none;">Ditandatangani secara elektronik oleh:</span>
                    <strong id="preview-jabatan" class="uppercase-text font-bold" style="margin-top: 1px;"></strong>
                    <div class="spacer"></div>
                    <span id="preview-nama" class="uppercase-text"></span>
                    <span id="preview-pangkat"></span>
                </div>
            </div>

            <button onclick="downloadImage()" class="mt-8 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full max-w-[330px]">
                Unduh Spesimen (PNG)
            </button>
        </div>
    </div>

    <script>
        function updatePreview() {
            const valJabatan = document.getElementById('input-jabatan').value;
            const valNama = document.getElementById('input-nama').value;
            const valPangkat = document.getElementById('input-pangkat').value;

            // Update Jabatan
            const jabatanEl = document.getElementById('preview-jabatan');
            if (valJabatan.trim() === "") {
                jabatanEl.innerText = "";
            } else {
                jabatanEl.innerText = valJabatan + ",";
            }

            // Update Nama
            document.getElementById('preview-nama').innerText = valNama;
            
            // Update Pangkat
            const pangkatEl = document.getElementById('preview-pangkat');
            if (valPangkat.trim() === "") {
                pangkatEl.style.display = 'none';
                pangkatEl.innerText = "";
            } else {
                pangkatEl.style.display = 'block';
                pangkatEl.innerText = valPangkat;
            }
        }

        function downloadImage() {
            const element = document.getElementById('spesimen-preview');
            html2canvas(element, { 
                scale: 4, 
                backgroundColor: "#ffffff"
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'spesimen-tte.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        updatePreview();
    </script>
</body>
</html>
